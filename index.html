<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SLOWTCG" />
    <meta name="theme-color" content="#0a0c11" />
    <title>SLOWTCG</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colors.
      try {
        var t = localStorage.getItem('slowtcg-theme')
        if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
